name: Deploy MD-33 to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MD-33
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build sanitized artifact
        run: |
          mkdir _site
          # Solo lo que el cliente necesita ver
          cp -r index.html verify.html dashboard.html manifest.json sw.js 404.html robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -r css js assets schemas legal pay .well-known _site/ 2>/dev/null || true
          # Limpia basura que no va a prod
          rm -rf _site/tests _site/docs/*.md _site/.github
          echo "Build MD-33 listo: $(du -sh _site | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4